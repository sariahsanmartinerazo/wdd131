<body>
    <header>
        <div class="site-header">
            <a href="index.html" class="logo">Discover Horizons 🌏</a>
            <nav>
                <a href="index.html">Home</a>
                <a href="destinations.html">Destinations</a>
                <a href="references.html">References</a>
                <a href="travel-tips.html">Travel Tips</a>
            </nav>
        </div>
    </header>

    <main>
        <section class="favorite">
            <h1>Choose your dream destination</h1>
            <p>Which destination would you like to explore?</p>
            <form id="favoriteForm">
                <label for="favoriteDestination">Select a destination:</label>
                <select id="favoriteDestination" name="favoriteDestination">
                    <option value="">Select a destination</option>
                    <option value="new-zealand">New Zealand</option>
                    <option value="japan">Japan</option>
                    <option value="australia">Australia</option>
                    <option value="brazil">Brazil</option>
                </select>
                <button type="button" id="saveFavorite">Save My Favorite</button>
            </form>
            <p id="favoriteMessage"></p>
            <div id="travelTips" class="travel-tips">
                <h3>Travel tips</h3>
                <p>Select a destination to see helpful travel tips.</p>
            </div>
        </section>
    </main>
    
    <footer>
        <p>&copy;<span id="currentyear"></span>
        Discover Horizons</p>
        <p><a href="references.html">References</a></p>
